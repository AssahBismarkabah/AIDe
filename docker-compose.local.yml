version: '3.8'

services:
  # Layer 2: Knowledge Graph Core
  neo4j:
    image: neo4j:5.15-community
    container_name: codemind-neo4j
    environment:
      NEO4J_AUTH: neo4j/dev123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"  # Web interface
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dev123 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codemind-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Layer 1: Data Ingestion & Analysis
  code-ingestion:
    build:
      context: .
      dockerfile: services/code-ingestion/Dockerfile
    container_name: codemind-code-ingestion
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev123
      - REDIS_URL=redis://redis:6379
      - WORKSPACE_PATH=/workspace
      - NODE_ENV=development
    volumes:
      - .:/workspace:ro  # Read-only access to project files
      - ./data/rdf:/app/rdf
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ast-analyzer:
    build:
      context: .
      dockerfile: services/ast-analyzer/Dockerfile
    container_name: codemind-ast-analyzer
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev123
      - SUPPORTED_LANGUAGES=java,python,javascript,typescript
      - NODE_ENV=development
    volumes:
      - .:/workspace:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  rdf-generator:
    build:
      context: .
      dockerfile: services/rdf-generator/Dockerfile
    container_name: codemind-rdf-generator
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev123
      - RDF_OUTPUT_PATH=/app/rdf
      - NODE_ENV=development
    volumes:
      - .:/workspace
      - ./data/rdf:/app/rdf
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # Layer 3: AI/LLM Integration
  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    container_name: codemind-llm-gateway
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  langchain-rag:
    build:
      context: .
      dockerfile: services/langchain-rag/Dockerfile
    container_name: codemind-langchain-rag
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev123
      - REDIS_URL=redis://redis:6379
      - LLM_GATEWAY_URL=http://llm-gateway:8001
      - NODE_ENV=development
    ports:
      - "8002:8002"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    restart: unless-stopped

  # Layer 4: Developer Assistance
  code-assistant:
    build:
      context: .
      dockerfile: services/code-assistant/Dockerfile
    container_name: codemind-code-assistant
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev123
      - LLM_GATEWAY_URL=http://llm-gateway:8001
      - RAG_ENGINE_URL=http://langchain-rag:8002
      - NODE_ENV=development
    ports:
      - "8003:8003"
    depends_on:
      neo4j:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      langchain-rag:
        condition: service_started
    restart: unless-stopped

  # Layer 5: Integration & APIs
  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    container_name: codemind-mcp-server
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev123
      - CODE_ASSISTANT_URL=http://code-assistant:8003
      - WORKSPACE_PATH=/workspace
      - NODE_ENV=development
    ports:
      - "8000:8000"  # MCP protocol port
    volumes:
      - .:/workspace:ro
    depends_on:
      neo4j:
        condition: service_healthy
      code-assistant:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: codemind-api-gateway
    environment:
      - CODE_ASSISTANT_URL=http://code-assistant:8003
      - MCP_SERVER_URL=http://mcp-server:8000
      - NODE_ENV=development
    ports:
      - "8080:8080"
    depends_on:
      code-assistant:
        condition: service_started
      mcp-server:
        condition: service_started
    restart: unless-stopped

  web-interface:
    build:
      context: .
      dockerfile: services/web-interface/Dockerfile
    container_name: codemind-web-interface
    environment:
      - REACT_APP_API_GATEWAY_URL=http://localhost:8080
      - REACT_APP_NEO4J_URI=bolt://localhost:7687
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  neo4j_data:
    name: codemind_neo4j_data
  neo4j_logs:
    name: codemind_neo4j_logs
  redis_data:
    name: codemind_redis_data

networks:
  default:
    name: codemind-network